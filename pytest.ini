[pytest]
# Alle Test-Verzeichnisse
testpaths = tests

# Automatisch angehängte Marker-Definitionen (weitere in tests/e2e/conftest.py)
markers =
    smoke: Schnelle Smoke-Tests – App startet und lädt
    navigation: Navigation zwischen Seiten
    explorer: Explorer-Seite und Filter-Flows
    accumulation: Accumulation-Toggle-Tests
    detail: Ticker-Detailansicht-Tests
    error_free: Fehlerfreie Nutzungs-Prüfungen
    requires_data: Test benötigt echte Datenbankdaten

# Timeout pro Test (pytest-timeout)
timeout = 90

# Ausgabe
addopts =
    -v
    --tb=short
    --strict-markers

# Playwright-spezifische Optionen werden via Umgebungsvariablen konfiguriert
# Siehe tests/e2e/conftest.py

