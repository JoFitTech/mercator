name: mercator

services:
  app:
    container_name: mercator-app
    build: .
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    environment:
      - LOCAL_MYSQL_HOST=mysql
      - LOCAL_MONGO_URI=mongodb://mongo:27017/
    volumes:
      - ./:/app
    ports:
      - "127.0.0.1:8501:8501"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      mongo:
        condition: service_healthy
      mysql:
        condition: service_healthy

  mongo:
    image: mongo:7
    container_name: mercator-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4
    container_name: mercator-mysql
    restart: unless-stopped
    command: --mysql-native-password=ON --authentication-policy=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_PASSWORD:-change_me}
      MYSQL_DATABASE: ${LOCAL_MYSQL_DATABASE:-mercator_local}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongo_data:
  mysql_data:
