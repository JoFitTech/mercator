name: finanzport

services:
  app:
    image: python:3.11-slim
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017/
      MYSQL_ACTIVE_TARGET: local
      LOCAL_MYSQL_HOST: mysql
      LOCAL_MYSQL_PORT: 3306
      LOCAL_MYSQL_DATABASE: finanzport_local
      LOCAL_MYSQL_USER: root
      LOCAL_MYSQL_PASSWORD: change_me
    volumes:
      - ./:/app
    ports:
      - "8501:8501"
    depends_on:
      mongo:
        condition: service_healthy
      mysql:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501"

  mongo:
    image: mongo:7
    container_name: finanzport-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4
    container_name: finanzport-mysql
    restart: unless-stopped
    command: --mysql-native-password=ON --authentication-policy=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: change_me
      MYSQL_DATABASE: finanzport_local
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongo_data:
  mysql_data:
